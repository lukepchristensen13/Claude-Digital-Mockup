<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantry Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f1ee;--card:#fff;--ink:#14302b;--mute:#5b736d;--acc:#f0d447;--line:#c9dbd6;--bad:#b3261e;--ok:#1f7a55;--warn:#c76b00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f1c;--card:#182b27;--ink:#e6f2ee;--mute:#8fa8a1;--line:#2b443e;--bad:#ff8a80;--ok:#6fd3a5;--warn:#ffb454}}
:root[data-theme="dark"]{--bg:#0f1f1c;--card:#182b27;--ink:#e6f2ee;--mute:#8fa8a1;--line:#2b443e;--bad:#ff8a80;--ok:#6fd3a5;--warn:#ffb454}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
.phone{max-width:480px;margin:0 auto;min-height:100vh;padding:20px 18px calc(196px + env(safe-area-inset-bottom,0px))}
h1{font-size:2rem;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:1.3rem;margin:0 0 4px}
p.sub{color:var(--mute);margin:0 0 18px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.btn{display:block;width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}
.btn.acc{background:var(--acc);color:#14302b}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.link{background:none;border:0;color:var(--ink);font:inherit;text-decoration:underline;cursor:pointer;padding:6px 0}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin-top:6px}
.note{background:var(--card);border-left:5px solid var(--ok);padding:12px;border-radius:8px;margin-top:14px}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center}
.hide{display:none!important}
.banner{background:var(--acc);color:#14302b;border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:.92rem}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.item.sel{border-color:var(--ink)}
.pic{font-size:1.8rem;width:48px;height:48px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none}
.grow{flex:1;min-width:0}
.name{font-weight:700}
.meta{color:var(--mute);font-size:.85rem}
.exp{font-weight:700;font-size:.85rem;text-align:right;white-space:nowrap}
.exp.soon{color:var(--warn)}.exp.gone{color:var(--bad)}.exp.fine{color:var(--ok)}
.bubble{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:transparent;flex:none;cursor:pointer;padding:0}
.sel .bubble{background:var(--ink)}
.used{width:22px;height:22px;flex:none;cursor:pointer;accent-color:var(--ok)} /* NEW: "used up" checkbox */
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600;cursor:pointer} /* NEW: "No expiration date" checkbox */
.chk input{width:20px;height:20px;padding:0;margin:0;flex:none;accent-color:var(--ok)}
input:disabled{opacity:.5}
select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit} /* NEW: unit type dropdown */
.ugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 10px} /* NEW: unit type / measurement / quantity */
.ingrow{border:1.5px solid var(--line);border-radius:12px;padding:4px 12px 12px;margin-bottom:10px} /* NEW: one recipe ingredient */
.ingrow .inhead{display:flex;gap:8px;align-items:flex-end}.ingrow .inhead>div{flex:1}
.ingrow .rm{border:0;background:none;color:var(--mute);font-size:1.1rem;cursor:pointer;padding:12px 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;justify-content:center;gap:10px;max-width:480px;margin:0 auto}
.tab{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:.85rem;padding:8px 4px;border-radius:12px;cursor:pointer}
.tab b{display:block;font-size:1.3rem}
.tab.mid{flex:1.5;background:none;color:var(--mute);padding:14px 4px;margin-top:-18px;font-weight:800}
.tab.on,.tab.mid.on{background:#fff;color:#000;font-weight:800}
.logout-tab{white-space:nowrap}
.actionbar{position:fixed;left:0;right:0;bottom:calc(118px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;display:flex;gap:10px;padding:0 96px 0 18px}
.actionbar .btn{margin:0}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(118px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;border:0;background:var(--acc);color:#14302b;font-size:2.6rem;line-height:1;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet textarea{width:100%;min-height:96px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;resize:vertical} /* NEW: recipe form */
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;max-width:850px} /* NEW: Saved Recipes buttons side by side */
.btnrow .btn{margin:0;flex:1 1 200px}
.btn.dash{background:var(--card);color:var(--ink);border:2px dashed var(--ok)} /* NEW: Add your own recipe */
.pill.mine{background:var(--ok);color:#fff;margin-left:4px;vertical-align:2px} /* NEW: Yours tag */
.pill{display:inline-block;background:var(--acc);color:#14302b;font-weight:800;font-size:.8rem;border-radius:99px;padding:3px 10px}
.pill.sug{background:var(--ink);color:var(--bg)}
details{background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;padding:0 14px}
summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::after{content:"+";font-size:1.3rem;line-height:1}
details[open] summary::after{content:"\2212"}
details ul,details ol{margin:0 0 10px;padding-left:20px}
.have{color:var(--ok)}.miss{color:var(--warn)}
.g{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.g.done span.t{text-decoration:line-through;color:var(--mute)}
.g input[type=checkbox]{width:22px;height:22px;flex:none}
.g .t{flex:1}
.mini{border:0;background:none;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:10px 16px;border-radius:10px;z-index:20;max-width:90%}
.toast.ok{background:var(--ok)}
 
/* ==========================================
   DESKTOP RESPONSIVE DESIGN
   ========================================== */
 
@media (min-width: 768px) {
 
    /* Expand the main application */
    .phone {
        max-width: 1200px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 100px 40px 120px;
    }
 
    /* Make headings more prominent */
    h1 {
        font-size: 2.5rem;
    }
 
    /* Give inventory items more room */
    .item {
        padding: 16px;
        gap: 16px;
        border-radius: 14px;
    }
 
    .pic {
        width: 56px;
        height: 56px;
        font-size: 2rem;
    }
 
    .name {
        font-size: 1.05rem;
    }
 
    .meta {
        font-size: 0.95rem;
    }
 
    /* Move navigation to the top of the page */
    .tabs {
        top: 0;
        bottom: auto;
        left: 0;
        right: 0;
 
        width: 100%;
        max-width: none;
        margin: 0;
 
        padding: 12px 40px;
 
        justify-content: flex-end;
        align-items: center;
        gap: 16px;
 
        background: var(--card);
        border-top: none;
        border-bottom: 1px solid var(--line);
    }
 
    .tab-spacer {
        flex: 1 1 auto;
    }
 
    .tab {
        flex: 0 0 auto;
        min-width: 130px;
        padding: 12px 18px;
        font-size: 0.95rem;
    }
 
    .tab b {
        display: inline;
        margin-right: 8px;
        font-size: 1.1rem;
    }
 
    /* Remove the raised center-tab effect on desktop */
    .tab.mid {
        flex: 0 0 auto;
        margin-top: 0;
        padding: 12px 18px;
        border-radius: 12px;
    }
 
    /* Position the floating add button */
    .fab {
        right: max(32px, calc((100vw - 1200px) / 2 + 32px));
        bottom: 32px;
        width: 76px;
        height: 76px;
        font-size: 2.8rem;
    }
 
    /* Expand the action bar when an item is selected */
    .actionbar {
        max-width: min(600px, calc(100vw - 248px));
        bottom: 32px;
        padding: 0 24px;
    }
 
    /* Make the add/edit modal wider */
    .sheet {
        max-width: 600px;
        padding: 28px;
        border-radius: 20px;
    }
 
    /* Keep the login and account forms readable */
    #app > h1,
    #app > .sub {
        max-width: 850px;
    }
 
    #app > label,
    #app > input,
    #app > .btn,
    #app > .err,
    #app > .note {
        max-width: 850px;
    }
}
 
/* Additional adjustments for smaller phones */
@media (max-width: 480px) {
    .tab-spacer { display:none; }
 
    .phone {
        padding-left: 14px;
        padding-right: 14px;
    }
 
    h1 {
        font-size: 1.75rem;
    }
 
    .item {
        gap: 8px;
        padding: 9px;
    }
 
    .exp {
        font-size: 0.75rem;
    }
 
    .meta {
        font-size: 0.8rem;
    }
}
 
/* Profile screen */
.profile-grid{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:20px;align-items:start;max-width:1000px}
.profile-card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px}
.profile-identity{text-align:center;padding:26px 20px}
.profile-avatar{width:82px;height:82px;border-radius:50%;background:var(--bg);border:3px solid var(--line);display:grid;place-items:center;margin:0 auto 12px;font-size:2rem;font-weight:800}
.profile-bio{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--mute);margin:14px 0 0}
.profile-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.profile-fields .wide{grid-column:1/-1}
.profile-fields textarea{width:100%;min-height:100px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.profile-fields input{margin:0}
.profile-radio{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.profile-radio label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:11px;padding:10px 13px;margin:0;cursor:pointer;background:var(--card)}
.profile-radio input{width:auto;accent-color:var(--ok)}
.profile-radio label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
@media(max-width:700px){.profile-grid{grid-template-columns:1fr}.profile-fields{grid-template-columns:1fr}.profile-fields .wide{grid-column:auto}}

/* NEW: sign-up onboarding steps */
.steps{display:flex;gap:6px;margin:6px 0 4px;max-width:850px}
.steps span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps span.on{background:var(--ok)}
.steplabel{font-size:.85rem;font-weight:700;color:var(--ok);margin:0 0 4px}
.navrow{display:flex;gap:10px;max-width:850px;margin-top:18px}
.navrow .btn{margin:0;flex:1}
.daychk{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.daychk label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:11px;padding:10px 13px;margin:0;cursor:pointer;background:var(--card);font-weight:600}
.daychk input{width:auto;accent-color:var(--ok)}
.daychk label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* NEW: alerts */
.tab{position:relative}
@media (max-width:767px){.tabs{gap:2px;padding-left:4px;padding-right:4px}.tab{font-size:.78rem;padding:8px 2px;min-width:0}.tab.mid{flex:1.3}}
.badge{position:absolute;top:0;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:.7rem;font-weight:800;line-height:18px;text-align:center}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;max-width:850px}
.alert.unread{border-color:var(--warn);border-left-width:5px}
.alert .pic{width:42px;height:42px;font-size:1.5rem}
.alert .msg{margin:0 0 4px}
.pill.ai{background:var(--ink);color:var(--bg);font-size:.7rem;padding:2px 8px;margin-left:6px;vertical-align:1px}

/* NEW: admin portal */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:1.8rem;line-height:1.1}
.stat span{color:var(--mute);font-size:.85rem}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
.barrow{display:grid;grid-template-columns:70px 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.bar{height:12px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.tablewrap{overflow-x:auto;background:var(--card);border:1.5px solid var(--line);border-radius:14px}
.tablewrap table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:620px}
.tablewrap th,.tablewrap td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tablewrap th{color:var(--mute);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
 
</style>
</head>

function until(e){var n=days(e);if(n<0)return'Expired';if(n==0)return'Today';if(n==1)return'1 day';if(n<14)return n+' days';if(n<60)return Math.round(n/7)+' weeks';return Math.round(n/30)+' months'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function v(id){return document.getElementById(id).value.trim()}
function toast(m,ok){var t=document.getElementById('toast');t.innerHTML='<div class="toast '+(ok?'ok':'')+'" role="alert">'+esc(m)+'</div>';setTimeout(function(){t.innerHTML=''},2600)}
function routeForState(){
 if(S.screen=='login')return '#/login';
 if(S.screen=='forgot')return '#/forgot-password';
 if(S.screen=='create')return '#/create-account';
 if(S.tab=='profile')return '#/profile';
 if(S.tab=='alerts')return '#/alerts'; // NEW
 if(S.tab=='admin')return '#/admin'; // NEW
 if(S.tab=='saved')return '#/recipes/saved';
 if(S.tab=='sug')return '#/recipes/suggested';
 if(S.tab=='groc')return '#/grocery-list';
 return '#/food-inventory';
}
function readHashRoute(){
 var path=(location.hash||'').replace(/^#\/?/,'').split('?')[0];
 if(path=='profile'){S.screen='app';S.tab='profile'}
 else if(path=='alerts'){S.screen='app';S.tab='alerts'} // NEW
 else if(path=='admin'){S.screen='app';S.tab='admin'} // NEW
 else if(path=='food-inventory'||path=='inventory'){S.screen='app';S.tab='inv'}
 else if(path=='grocery-list'){S.screen='app';S.tab='groc'}
 else if(path=='recipes'||path=='recipes/saved'){S.screen='app';S.tab='saved'}
 else if(path=='recipes/suggested'){S.screen='app';S.tab='sug'}
 else if(path=='login'){S.screen='login'}
 else if(path=='forgot-password'){S.screen='forgot'}
 else if(path=='create-account'||path==''){S.screen='create'}
 else return false;
 return true;
}

// Password hashing (SHA-256) so plain-text passwords are never stored
async function sha(t){return sha256js(t)}
function sha256js(s){var b=new TextEncoder().encode(s),K=[],H=[],i,j,n,c,f,pr;
 for(n=2,c=0;c<64;n++){pr=1;for(f=2;f*f<=n;f++)if(n%f==0){pr=0;break}if(pr){if(c<8)H[c]=Math.pow(n,1/2)*4294967296|0;K[c++]=Math.pow(n,1/3)*4294967296|0}}
 var l=b.length,w=new Uint8Array(((l+9+63)>>6)<<6);w.set(b);w[l]=128;var dv=new DataView(w.buffer);
 dv.setUint32(w.length-4,(l*8)>>>0);dv.setUint32(w.length-8,Math.floor(l/536870912));
 for(i=0;i<w.length;i+=64){var W=[],a=H.slice(0);
  for(j=0;j<64;j++){if(j<16)W[j]=dv.getUint32(i+j*4);else{var x=W[j-15],y=W[j-2];W[j]=(((x>>>7|x<<25)^(x>>>18|x<<14)^(x>>>3))+W[j-7]+((y>>>17|y<<15)^(y>>>19|y<<13)^(y>>>10))+W[j-16])|0}
   var e=a[4],A=a[0],t1=a[7]+((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))+((e&a[5])^(~e&a[6]))+K[j]+W[j],t2=((A>>>2|A<<30)^(A>>>13|A<<19)^(A>>>22|A<<10))+((A&a[1])^(A&a[2])^(a[1]&a[2]));
   a=[(t1+t2)|0].concat(a);a[4]=(a[4]+t1)|0;a.length=8}
  for(j=0;j<8;j++)H[j]=(H[j]+a[j])|0}
 return H.map(function(h){return(h>>>0).toString(16).padStart(8,'0')}).join('')}
function setUser(row){S.uid=row.user_id;S.user=row.username;try{localStorage.setItem('pantry_user',JSON.stringify({id:row.user_id,u:row.username}))}catch(e){}}
async function loadAll(){
 var res=await Promise.all([
  sb.from('inventory_items').select('*').eq('user_id',S.uid).eq('is_used_up',false),
  sb.from('grocery_list_items').select('*').eq('user_id',S.uid).order('grocery_item_id'),
  sb.from('saved_recipes').select('*').eq('user_id',S.uid),
  sb.from('inventory_items').select('*').eq('user_id',S.uid).eq('is_used_up',true)]); // NEW: also load used items
 S.inv=chk(res[0]).map(rowInv);
 S.used=chk(res[3]).map(rowInv); // NEW
 S.groc=chk(res[1]).map(rowG);
 var sr=chk(res[2]);
 S.mine=sr.filter(function(r){return r.ingredients}).map(rowMine); // NEW: the user's own recipes
 S.saved=sr.filter(function(r){return !r.ingredients}).map(function(r){return R.findIndex(function(x){return x.n==r.recipe_name})}).filter(function(i){return i>-1});
 // CHANGED: select('*') so new columns (notify_days, in_app_alerts, is_admin) load if they exist
 var pr=await sb.from('users').select('*').eq('user_id',S.uid).single();
 if(!pr.error&&pr.data){delete pr.data.password_hash;S.profile=Object.assign({},S.profile,pr.data)}
 await loadNotes(); // NEW
}

 {t:'About You',s:'Let\'s start with your name.',f:[['First name','fn','text','given-name'],['Last name','ln','text','family-name']]},
 {t:'Contact Info',s:'We use this for your account and expiration alerts.',f:[['Email address','em','email','email'],['Phone number','ph','tel','tel']]},
 {t:'Create Your Login',s:'Pick a username and a strong password.',f:[['Username','us','text','username'],['Password','pw','password','new-password'],['Confirm password','pw2','password','new-password']]},

function createH(){var su=S.su,st=SU_STEPS[su.step-1],h='';
 h+='<h1>Create Your Account</h1><p class="steplabel">Step '+su.step+' of '+SU_STEPS.length+': '+st.t+'</p>';
 h+='<div class="steps" aria-hidden="true">'+SU_STEPS.map(function(x,i){return '<span class="'+(i<su.step?'on':'')+'"></span>'}).join('')+'</div>';

 if(su.step==3)h+='<p class="meta">Password: 12+ characters, one capital letter, one special character.</p>';

// keep what was typed when moving between steps
function suKeep(){SU_STEPS[S.su.step-1].f.forEach(function(f){var el=document.getElementById(f[1]);if(el)S.su[f[1]]=el.value.trim()});
 if(S.su.step==4){var n=readNotif();S.su.notification_preference=n.pref;S.su.notify_days=n.days}}
function suBack(){suKeep();S.su.step--;render()}
async function suNext(){suKeep();var su=S.su;
 if(su.step==1){if(!su.fn)return err('Please enter your first name.');if(!su.ln)return err('Please enter your last name.')}
 if(su.step==2){if(!su.em)return err('Please enter your email address.');if(!/^\S+@\S+\.\S+$/.test(su.em))return err('Please enter a valid email address.');if(!su.ph)return err('Please enter your phone number.');
  if(sb){var r=await sb.from('users').select('user_id').eq('email',su.em).maybeSingle();if(r.data)return err('An account with that email already exists. Try logging in.')}}
 if(su.step==3){if(!su.us)return err('Please choose a username.');var p=su.pw||'';
  if(p.length<12||!/[A-Z]/.test(p)||!/[^A-Za-z0-9]/.test(p))return err('Password needs 12+ characters, a capital letter and a special character.');
  if(p!==su.pw2)return err('Passwords do not match.');
  if(sb){var r2=await sb.from('users').select('user_id').eq('username',su.us).maybeSingle();if(r2.data)return err('That username is already taken.')}}
 if(su.step<SU_STEPS.length){su.step++;render();var first=document.querySelector('#app input');if(first)first.focus();return}
 return doCreate()}
async function doCreate(){var su=S.su;
 var prof={first_name:su.fn,last_name:su.ln,email:su.em,phone_number:su.ph,bio:'',notification_preference:su.notification_preference,notify_days:su.notify_days,in_app_alerts:true,is_admin:false};
 if(!sb){S.user=su.us;S.email=su.em;S.pass=su.pw;S.profile=prof;S.su={step:1,notification_preference:'email',notify_days:[7,3,1]};return go('app','inv')}
 try{
  var row={username:su.us,email:su.em,password_hash:await sha(su.pw),first_name:su.fn,last_name:su.ln,phone_number:su.ph,notification_preference:su.notification_preference,notify_days:su.notify_days,in_app_alerts:true};
  var r=await sb.from('users').insert(row).select('user_id,username').single();
  // if the setup SQL hasn't been run yet, create the account without the new alert columns
  if(r.error&&/notify_days|in_app_alerts|notification_preference/.test(r.error.message||'')){delete row.notify_days;delete row.in_app_alerts;delete row.notification_preference;r=await sb.from('users').insert(row).select('user_id,username').single()}
  if(r.error)return err(r.error.code=='23505'?'That username or email is already taken.':'Could not create account: '+r.error.message);
  S.profile=prof;S.su={step:1,notification_preference:'email',notify_days:[7,3,1]};setUser(r.data);await loadAll();go('app','inv');toast('Account created. Welcome to Pantry!',1)
 }catch(e){fail(e)}}

function loginH(){return '<h1>Welcome Back</h1><p class="sub">Log in to see what is in your kitchen.</p><label for="lu">Username or email</label><input id="lu"><label for="lp">Password</label><input id="lp" type="password"><div class="err" id="e" role="alert"></div><button class="btn acc" onclick="doLogin()">Log in</button>'+

async function doLogin(){var u=v('lu'),p=v('lp');
 if(!u||!p)return err('Please enter your username and password.');
 if(!sb){var ok=(u=='demo'&&p=='Demo-Pass-1234!')||(S.user&&(u==S.user||u==S.email)&&p==S.pass);
  if(!ok)return err('Username or password is incorrect. Try again.');
  if(u=='demo'){S.user='demo';S.profile.is_admin=true} // NEW: offline demo account can see the admin portal
  go('app','inv');return alertPopup()}
 try{
  var r=await sb.from('users').select('user_id,username,password_hash').eq(u.indexOf('@')>-1?'email':'username',u).maybeSingle();
  if(r.error)throw r.error;
  if(!r.data||r.data.password_hash!==await sha(p))return err('Username or password is incorrect. Try again.');
  setUser(r.data);await loadAll();go('app','inv');alertPopup() // NEW: popup if food is expiring
 }catch(e){fail(e)}}
function forgotH(){return '<h1>Reset Password</h1><p class="sub">Enter the email linked to your account.</p><label for="fe">Email address</label><input id="fe" type="email"><div class="err" id="e" role="alert"></div><div id="ok"></div><button class="btn acc" onclick="doForgot()">Send recovery link</button><button class="link" style="margin-top:14px" onclick="go(\'login\')">Back to log in</button>'}

function invH(){

 var l=S.inv.slice().sort(function(a,b){if(!a.e)return 1;if(!b.e)return -1;return a.e<b.e?-1:1}); // CHANGED: no-expiration items go last

 var x=S.inv.filter(function(i){return i.id==id})[0];if(!x)return;
 if(sb){try{chk(await sb.from('inventory_items').update({is_used_up:true}).eq('item_id',id))}catch(e){fail(e);return render()}}

async function saveItem(id){var n=v('in'),e=v('ie'),d=v('id'),ne=document.getElementById('ne').checked;

 var un=readUnit(document.querySelector('#iunit .unitbox'),{qint:1,qmax:MAXQ}); // NEW: unit type, measurement, quantity

 else{
  if(!e)return err('Please enter an expiration date or check "No expiration date".');
  if(e<today())return err('Please enter a date on or after today.');
  if(e>maxExp())return err('Please enter a date within 3 years from today.'); // NEW: max date
 }
 if(sb){
  try{var row={item_name:n,quantity:+q,unit_type:un.u,unit_amount:un.a,expiration_date:e||null,details:d||null,icon:icon(n)}; // CHANGED: units; null when no expiration
   var send=function(rw){return id?sb.from('inventory_items').update(rw).eq('item_id',id).select().single()
           :sb.from('inventory_items').insert(Object.assign({user_id:S.uid},rw)).select().single()};
   var r=await send(row);

 else S.inv.push({id:S.nid++,n:n,q:+q,u:un.u,a:un.a,e:e,d:d,i:icon(n)});
 closeM();S.sel=null;render()}

function readIngs(){var out=[],rows=document.querySelectorAll('#ingrows .ingrow');
 for(var i=0;i<rows.length;i++){var n=rows[i].querySelector('.inm').value.trim();if(!n)continue;
  var un=readUnit(rows[i].querySelector('.unitbox'));if(typeof un=='string')return n+': '+un;
  out.push({n:n,u:un.u,a:un.a,q:un.q})}
 return out}
function lines(id){return document.getElementById(id).value.split('\n').map(function(x){return x.trim()}).filter(Boolean)}
async function saveRecipe(){var n=v('rn'),t=v('rt'),ing=readIngs(),st=lines('rs');
 if(!n)return err('Please enter a recipe name.');
 if(typeof ing=='string')return err(ing);
 if(!ing.length)return err('Please add at least one ingredient.');
 if(!st.length)return err('Please add at least one step.');
 if(S.mine.some(function(r){return r.n.toLowerCase()==n.toLowerCase()}))return err('You already have a recipe with that name.');
 var rec={n:n,t:t,ing:ing,st:st};
 if(sb){try{rec=rowMine(chk(await sb.from('saved_recipes').insert({user_id:S.uid,recipe_name:n,cook_time:t||null,ingredients:ing,steps:st}).select().single()))}
  catch(e){return err(e.code=='23505'?'You already have a recipe with that name.':/column/i.test(e.message||'')?'The database needs a quick update before custom recipes can be saved (see the setup note).':'Could not save: '+e.message)}}
 S.mine.unshift(rec);closeM();toast('Recipe saved.',1);go('app','saved')}
async function delMine(k){var r=S.mine[k];if(!r||!confirm('Delete "'+r.n+'"?'))return;
 if(sb){try{chk(await sb.from('saved_recipes').delete().eq('user_id',S.uid).eq('recipe_name',r.n).not('ingredients','is',null))}catch(e){return fail(e)}}
 S.mine.splice(k,1);render()}
async function addMissingMine(k){
 try{var m=S.mine[k].ing.filter(function(g){return !has(g)});for(var i=0;i<m.length;i++)await addG(ingObj(m[i]).n)}catch(e){return fail(e)}

 if(sb){try{chk(await sb.from('saved_recipes').delete().eq('user_id',S.uid).eq('recipe_name',R[i].n))}catch(e){return fail(e)}}
 S.saved=S.saved.filter(function(x){return x!=i});render()}

async function save(i){
 if(sb){try{chk(await sb.from('saved_recipes').insert({user_id:S.uid,recipe_name:R[i].n}).select().single())}catch(e){return fail(e)}}

async function addMissing(i){
 try{var m=R[i].ing.filter(function(g){return !has(g)});for(var k=0;k<m.length;k++)await addG(ingObj(m[k]).n)}catch(e){return fail(e)}

async function addG(n,src){
 if(S.groc.some(function(x){return x.n.toLowerCase()==n.toLowerCase()}))return;
 if(sb)S.groc.push(rowG(chk(await sb.from('grocery_list_items').insert({user_id:S.uid,item_name:n,source_item_id:src||null}).select().single())));
 else S.groc.push({id:S.nid++,n:n,done:false})}
 
function grocH(){
 var h='<h1>Grocery List</h1><p class="sub">Check items off as you shop.</p><div class="row"><input id="gi" placeholder="Add an item" aria-label="Add an item"><button class="btn acc" style="width:auto;margin:0;padding:12px 18px" onclick="gAdd()">Add</button></div>';
 h+='<button class="btn ghost" style="margin-top:12px" onclick="S.gopen=!S.gopen;render()">'+(S.gopen?'Hide':'See')+' suggested items</button>';

  h+='<div class="note">'+(s.length?s.map(function(x){return '<div class="between"><span>'+esc(x.n)+' <span class="meta">'+(x.u?'used up':x.q<=1?'running low':'expiring soon')+'</span></span><button class="mini" onclick="gSug('+x.id+')">Add</button></div>'}).join(''):'Nothing to suggest right now.')+'</div>'}

 S.groc.forEach(function(g){h+='<div class="g '+(g.done?'done':'')+'"><input type="checkbox" '+(g.done?'checked':'')+' onchange="gTog('+g.id+')" aria-label="Bought '+esc(g.n)+'"><span class="t">&bull; '+esc(g.n)+'</span><button class="mini" onclick="gEdit('+g.id+')">Edit</button><button class="mini" onclick="gDel('+g.id+')">Delete</button></div>'});

// NEW: EXPIRATION ALERTS (in-app). AI messages come from the "notifications"
// table, written by the daily automation. If the automation hasn't run yet,
// the site still makes its own reminder for items that hit an alert day.
// =====================================================================
function alertDays(p){p=p||S.profile||{};var d=p.notify_days;if(d==null)return [7,3,1];
 if(typeof d=='string')d=d.replace(/[{}]/g,'').split(',').filter(Boolean);return d.map(Number)}
function inApp(){return (S.profile||{}).in_app_alerts!==false}
function plural(n){return n+' day'+(n==1?'':'s')}
function daysText(ds){ds=ds.slice().sort(function(a,b){return b-a}).map(plural);if(!ds.length)return 'never';if(ds.length==1)return ds[0];return ds.slice(0,-1).join(', ')+(ds.length>2?',':'')+' and '+ds[ds.length-1]}
function defMsg(x,d){return x.n+(d<=0?' expires today':' expires in '+plural(d))+'. Use it soon or find a recipe for it!'}
function noteFor(id,d){return S.notes.filter(function(n){return n.item_id==id&&n.days_left==d})[0]}
function findItem(id){return S.inv.concat(S.used).filter(function(x){return x.id==id})[0]}
// items that hit one of the user's alert days today
function dueAlerts(){var ds=alertDays();
 return S.inv.filter(function(x){return x.e&&ds.indexOf(days(x.e))>-1}).map(function(x){var d=days(x.e),n=noteFor(x.id,d);return {item:x,d:d,msg:n?n.message:defMsg(x,d)}})}
function readSet(){try{return JSON.parse(localStorage.getItem('pantry_read_'+(S.uid||'offline'))||'[]')}catch(e){return []}}
function saveReadSet(a){try{localStorage.setItem('pantry_read_'+(S.uid||'offline'),JSON.stringify(a.slice(-200)))}catch(e){}}
// every alert to show: AI ones from the database + the site's own for anything not covered yet
function allAlerts(){var rs=readSet(),out=[];
 S.notes.forEach(function(n){var it=findItem(n.item_id);
  out.push({key:'n-'+n.notification_id,msg:n.message,icon:it?it.i:'🔔',ai:true,ch:n.channel,when:(n.created_at||'').slice(0,10),read:!!n.is_read})});
 dueAlerts().forEach(function(a){if(noteFor(a.item.id,a.d))return;var k='loc-'+a.item.id+'-'+a.d+'-'+today();
  out.push({key:k,msg:a.msg,icon:a.item.i,ai:false,ch:'in_app',when:today(),read:rs.indexOf(k)>-1})});
 return out.sort(function(a,b){return (a.read-b.read)||(a.when<b.when?1:-1)})}
function unreadCount(){return inApp()?allAlerts().filter(function(a){return !a.read}).length:0}
function alertPopup(){var n=unreadCount();if(n)setTimeout(function(){toast('🔔 You have '+n+' new expiration alert'+(n>1?'s':'')+'. Check the Alerts tab.',1)},300)}
async function markRead(key){
 if(key.indexOf('n-')==0){var id=key.slice(2),n=S.notes.filter(function(x){return String(x.notification_id)==id})[0];if(!n)return;
  if(sb){var r=await sb.from('notifications').update({is_read:true}).eq('notification_id',id);if(r.error)return fail(r.error)}
  n.is_read=true}
 else{var rs=readSet();if(rs.indexOf(key)<0){rs.push(key);saveReadSet(rs)}}
 render()}
async function markAllRead(){var l=allAlerts().filter(function(a){return !a.read});for(var i=0;i<l.length;i++)await markRead(l[i].key);toast('All alerts marked as read.',1)}
function alertsH(){var l=allAlerts(),ds=alertDays();
 var h='<h1>Alerts</h1><p class="sub">Reminders before your food expires.</p>';
 h+='<div class="row" style="flex-wrap:wrap;gap:6px 18px;margin-bottom:14px">'+(l.some(function(a){return !a.read})?'<button class="mini" onclick="markAllRead()">Mark all as read</button>':'')+'<button class="mini" onclick="go(\'app\',\'profile\')">Notification settings</button></div>';
 if(!inApp())h+='<div class="note" style="border-color:var(--warn);max-width:850px;margin-bottom:14px">In-app alerts are turned off, so you won\'t see banners or a badge. Turn them back on in Notification Settings.</div>';
 if(!l.length)h+='<div class="note" style="max-width:850px">No alerts right now. Pantry will remind you '+daysText(ds)+' before food expires.</div>';
 l.forEach(function(a){var how=a.ch=='email'?'Sent by email':a.ch=='text'?'Sent by text':'In-app';
  h+='<div class="alert'+(a.read?'':' unread')+'"><div class="pic">'+a.icon+'</div><div class="grow"><p class="msg">'+esc(a.msg)+(a.ai?'<span class="pill ai" title="Written by AI">AI</span>':'')+'</p><div class="meta">'+(a.read?'':'<b>New</b> &middot; ')+how+' &middot; '+esc(a.when)+'</div></div>'+(a.read?'':'<button class="mini" onclick="markRead(\''+a.key+'\')">Mark read</button>')+'</div>'});
 return h}

function isAdmin(){return !!(S.profile||{}).is_admin}
async function loadAdmin(){S.admin={loading:true};var d;
 if(sb){var q=function(t,c){return sb.from(t).select(c).limit(5000).then(function(r){return r.error?null:r.data})};
  var res=await Promise.all([q('users','*'),q('inventory_items','item_id,user_id,item_name,is_used_up,expiration_date'),q('grocery_list_items','grocery_item_id,user_id,is_checked'),q('saved_recipes','user_id,ingredients'),q('notifications','channel,created_at')]);
  d={users:(res[0]||[]).map(function(u){delete u.password_hash;return u}),items:res[1]||[],groc:res[2]||[],recipes:res[3]||[],notes:res[4]};
 }else{ // offline prototype: stats from this browser
  d={users:[Object.assign({user_id:1,username:S.user||'demo',created_at:new Date().toISOString()},S.profile)],
   items:S.inv.map(function(x){return {user_id:1,item_name:x.n,is_used_up:false,expiration_date:x.e}}).concat(S.used.map(function(x){return {user_id:1,item_name:x.n,is_used_up:true,expiration_date:x.e}})),
   groc:S.groc.map(function(g){return {user_id:1,is_checked:g.done}}),recipes:S.saved.map(function(){return {user_id:1}}).concat(S.mine.map(function(){return {user_id:1,ingredients:[1]}})),notes:S.notes}}

function profileH(){var p=S.profile||{},full=[p.first_name,p.last_name].filter(Boolean).join(' ')||S.user||'Your profile',initial=(p.first_name||S.user||'U').charAt(0).toUpperCase();
 return '<div class="profile-grid"><section><div class="profile-card profile-identity"><div class="profile-avatar" aria-hidden="true">'+esc(initial)+'</div><h2>'+esc(full)+'</h2><div class="meta">@'+esc(S.user||'username')+'</div><p class="profile-bio">'+esc(p.bio||'Add a short bio to tell people a little about yourself.')+'</p></div><div class="note">🔒 Your password is private and is never displayed here.</div>'+(isAdmin()?'<button class="btn" onclick="go(\'app\',\'admin\')">📊 Open Admin Portal</button>':'')+'</section>'+
 '<div><section class="profile-card"><h1>My Profile</h1><p class="sub">Update your account details.</p><div class="profile-fields">'+
 '<div><label for="pf_fn">First name</label><input id="pf_fn" value="'+esc(p.first_name||'')+'" autocomplete="given-name"></div>'+ 
 '<div><label for="pf_ln">Last name</label><input id="pf_ln" value="'+esc(p.last_name||'')+'" autocomplete="family-name"></div>'+ 
 '<div><label for="pf_us">Username</label><input id="pf_us" value="'+esc(S.user||'')+'" autocomplete="username"></div>'+ 
 '<div><label for="pf_em">Email address</label><input id="pf_em" type="email" value="'+esc(p.email||S.email||'')+'" autocomplete="email"></div>'+ 
 '<div><label for="pf_ph">Phone number</label><input id="pf_ph" type="tel" value="'+esc(p.phone_number||'')+'" autocomplete="tel"></div>'+ 
 '<div class="wide"><label for="pf_bio">About me</label><textarea id="pf_bio" maxlength="280" placeholder="Share a little about yourself, your cooking style, or favorite foods…">'+esc(p.bio||'')+'</textarea><div class="meta">Up to 280 characters.</div></div></div>'+ 
 '<div class="err" id="profileErr" role="alert"></div><button class="btn acc" onclick="saveProfile()">Save profile</button></section>'+
 // NEW: notification settings card
 '<section class="profile-card" id="notif-settings"><h2>Notification Settings</h2><p class="sub">Choose how and when Pantry warns you before food expires.</p>'+
 notifFields(p.notification_preference,alertDays(p),inApp())+
 '<div class="err" id="nfErr" role="alert"></div><button class="btn acc" onclick="saveNotif()">Save notification settings</button></section></div></div>'}
// CHANGED: notification preference moved to its own card (saveNotif); profile data is merged so admin/alert settings aren't lost
async function saveProfile(){var fn=v('pf_fn'),ln=v('pf_ln'),em=v('pf_em'),ph=v('pf_ph'),un=v('pf_us'),bio=v('pf_bio');
 if(!fn||!ln||!em||!un)return profileErr('Please fill in your first name, last name, username, and email address.');
 if(!/^\S+@\S+\.\S+$/.test(em))return profileErr('Please enter a valid email address.');
 var patch={first_name:fn,last_name:ln,email:em,phone_number:ph,username:un,bio:bio};
 if(sb){try{var r=await sb.from('users').update(patch).eq('user_id',S.uid).select('*').single();if(r.error)throw r.error;delete r.data.password_hash;S.profile=Object.assign({},S.profile,r.data);S.user=r.data.username;try{localStorage.setItem('pantry_user',JSON.stringify({id:S.uid,u:S.user}))}catch(e){}}catch(e){return profileErr('Could not save profile: '+e.message)}}else{S.profile=Object.assign({},S.profile,patch);S.user=un;S.email=em;try{localStorage.setItem('pantry_profile_'+(S.uid||'offline'),JSON.stringify(S.profile))}catch(e){}}
 toast('Profile saved.',1);render()}
function profileErr(m){var e=document.getElementById('profileErr');if(e)e.textContent=m;else toast(m)}
 
function tabsH(){var t=S.tab;
 return '<nav class="tabs"><button class="tab logout-tab" type="button" onclick="logout()">Log out</button><button class="tab '+(t=='profile'?'on':'')+'" onclick="go(\'app\',\'profile\')"><b>👤</b>Profile</button><span class="tab-spacer" aria-hidden="true"></span><button class="tab '+(t=='saved'||t=='sug'?'on':'')+'" onclick="go(\'app\',\'saved\')"><b>📖</b>Recipes</button><button class="tab mid '+(t=='inv'?'on':'')+'" onclick="go(\'app\',\'inv\')"><b>🧊</b>Food Inventory</button><button class="tab '+(t=='groc'?'on':'')+'" onclick="go(\'app\',\'groc\')"><b>🛒</b>Grocery List</button>'+
 // NEW: Alerts tab with unread count, Admin tab for admins only
 (function(){var n=unreadCount();return '<button class="tab '+(t=='alerts'?'on':'')+'" onclick="go(\'app\',\'alerts\')" aria-label="Alerts'+(n?', '+n+' unread':'')+'"><b>🔔</b>Alerts'+(n?'<span class="badge" aria-hidden="true">'+n+'</span>':'')+'</button>'})()+
 (isAdmin()?'<button class="tab '+(t=='admin'?'on':'')+'" onclick="go(\'app\',\'admin\')"><b>📊</b>Admin</button>':'')+'</nav>'}
 
// Restore the signed-in account and load its profile from Supabase.
(async function start(){
 if(sb){var s=null;try{s=JSON.parse(localStorage.getItem('pantry_user'))}catch(e){}
  if(s&&s.id){S.uid=s.id;S.user=s.u;S.screen='app';S.tab='inv';S.inv=[];S.groc=[];S.saved=[];S.mine=[];S.used=[];
   try{await loadAll()}catch(e){fail(e)}}
 }else{try{var p=JSON.parse(localStorage.getItem('pantry_profile_offline')||'null');if(p){S.profile=p;S.user=p.username;S.email=p.email;S.screen='app'}}catch(e){}}
 if(location.hash){if(!readHashRoute())location.hash=routeForState()}else location.hash=routeForState();
 render()})();
</script>
